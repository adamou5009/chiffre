<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vœux Nouvel An 2026</title>
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: radial-gradient(circle at center, #000015, #05000a);
    color: white;
}

/* Titre Fixe */
#fixed-header {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 100;
    font-size: 1.5em;
    font-weight: 300;
    letter-spacing: 3px;
    color: rgba(255, 215, 0, 0.8);
    text-transform: uppercase;
    text-shadow: 0 0 10px gold;
    display: none;
}

#ui-layer {
    text-align: center;
    position: relative;
    z-index: 10;
    background: rgba(0, 0, 0, 0.7);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 215, 0, 0.3);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
}

input {
    padding: 12px;
    font-size: 1.1em;
    border-radius: 8px;
    border: 1px solid gold;
    background: rgba(255,255,255,0.1);
    color: white;
    margin-bottom: 15px;
    width: 250px;
    text-align: center;
    outline: none;
}

button {
    padding: 12px 25px;
    font-size: 1.1em;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg, #d4af37, #f9e27b);
    color: #1a1a1a;
    font-weight: bold;
    transition: all 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px gold;
}

#greeting-container {
    position: absolute;
    width: 90%;
    max-width: 800px;
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.wish-text {
    font-size: 2.5em;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 20px rgba(255,255,255,0.7);
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="fixed-header">Adamou ton amour te souhaite...</div>

<canvas id="mainCanvas"></canvas>

<div id="ui-layer">
    <h1 style="color: gold; margin-top: 0; font-size: 1.8em;">Célébrons 2026</h1>
    <p>Entrez votre nom pour commencer</p>
    <input type="text" id="userName" placeholder="Ton prénom..." maxlength="15"><br>
    <button onclick="initApp()">Découvrir mes vœux</button>
</div>

<div id="greeting-container"></div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const greetingContainer = document.getElementById('greeting-container');
const uiLayer = document.getElementById('ui-layer');
const header = document.getElementById('fixed-header');

let width, height;
let hearts = [];
let fireworks = [];
let isRunning = false;

const wishes = [
    "Mon amour en cette nouvelle année je te souhaite",
    "une santé de fer pour cette année,",
    "du succès dans tous tes projets,",
    "des moments de joie infinie,",
    "beaucoup d'amour et de paix,",
    "que notre amour soit plus fort que l'année précédente",
    "et que 2026 soit ta meilleure année !",
    "Je t'aime de tout mon cœur."

];

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- OBJETS ---
class Heart {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 100;
        this.size = 2 + Math.random() * 8;
        this.speed = 0.3 + Math.random() * 1;
        this.alpha = 0.1 + Math.random() * 0.4;
    }
    update() {
        this.y -= this.speed;
        if (this.y < -20) this.reset();
    }
    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = "#ffb6c1";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Firework {
    constructor() {
        this.x = Math.random() * width;
        this.y = height;
        this.targetY = 100 + Math.random() * (height / 2);
        this.speed = 5 + Math.random() * 4;
        this.exploded = false;
        this.particles = [];
        this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
    }
    update() {
        if (!this.exploded) {
            this.y -= this.speed;
            if (this.y <= this.targetY) this.explode();
        } else {
            this.particles = this.particles.filter(p => p.alpha > 0);
            this.particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.05;
                p.alpha -= 0.015;
            });
        }
    }
    explode() {
        this.exploded = true;
        for (let i = 0; i < 50; i++) {
            const angle = Math.random() * Math.PI * 2;
            const force = 2 + Math.random() * 3;
            this.particles.push({
                x: this.x, y: this.y,
                vx: Math.cos(angle) * force,
                vy: Math.sin(angle) * force,
                alpha: 1
            });
        }
    }
    draw() {
        if (!this.exploded) {
            ctx.fillStyle = "white";
            ctx.fillRect(this.x, this.y, 2, 6);
        } else {
            this.particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    }
}

// --- LOGIQUE ---
function initApp() {
    const name = document.getElementById('userName').value || "Ami(e)";
    uiLayer.style.display = 'none';
    header.style.display = 'block';
    isRunning = true;
    
    for(let i=0; i<30; i++) hearts.push(new Heart());
    
    startWishes(name);
    animate();
}

function startWishes(name) {
    let index = 0;

    function next() {
        if (index < wishes.length) {
            greetingContainer.innerHTML = `<div class="wish-text"><span style="color:gold">${name}</span>, ${wishes[index]}</div>`;
            const el = greetingContainer.firstChild;
            el.style.opacity = 0;
            el.style.transition = "opacity 1s ease";
            
            setTimeout(() => el.style.opacity = 1, 100);
            setTimeout(() => {
                el.style.opacity = 0;
                index++;
                setTimeout(next, 1000);
            }, 4000);

            fireworks.push(new Firework());
        } else {
            greetingContainer.innerHTML = `<div class="wish-text" style="color:gold; font-size:3.5em; text-shadow: 0 0 30px orange;">BONNE ANNÉE 2026 !</div>`;
            setInterval(() => fireworks.push(new Firework()), 600);
        }
    }
    next();
}

function animate() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(0, 0, 20, 0.2)";
    ctx.fillRect(0, 0, width, height);

    hearts.forEach(h => { h.update(); h.draw(); });
    fireworks = fireworks.filter(f => !f.exploded || f.particles.length > 0);
    fireworks.forEach(f => { f.update(); f.draw(); });

    requestAnimationFrame(animate);
}
</script>
</body>
</html>
